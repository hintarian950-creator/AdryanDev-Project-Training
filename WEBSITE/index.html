<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <nav>
        <a href="">About us</a>
        <a href="">Contact us</a>
        <a href="">Support us</a>
    </nav>
    <form action="">
        <div class="form-login">
            <label for="nama">Nama</label> <br>
            <input type="text" required placeholder="Masukan Nama"> <br>
            <label for="email">Email</label> <br>
            <input type="text" required placeholder="Masukan Email"> <br>
            <label for="password">Password</label> <br>
            <input type="password" required placeholder="Masukan Password"> <br>
            <button>LOGIN</button>
        </div>
    </form>
    <style>
        body{
            scroll-behavior: smooth;
            margin: 0;
        }
        form{
            display: flex;
            justify-content: center;
            height: 100vh;
            align-items: center;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        .form-login{
            display: flex;
            background-color: gray;
            padding: 20px;
            flex-direction: column;
            border-radius: 10px;
            color: white;
        }
        nav{
            padding: 10px;
            background-color: gray;
            display: flex;
            gap: 20px;
        }
        nav, a{
            text-decoration: none;
            color: white;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        input{
            padding: 10px;
            border-radius: 5px;
            border: 1px solid gray;
        }
        button{
            padding: 5px;
            border: none;
            border-radius: 10px;
        }
    </style>
</body>
</html>
